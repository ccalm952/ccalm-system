name: ccalm-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ccalm
      POSTGRES_PASSWORD: ccalm_test
      POSTGRES_DB: ccalm_test
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ccalm_test_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccalm -d ccalm_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  ccalm_test_pg:
