name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    # 仅文档/小程序/编辑器配置变更时不跑完整 CI，也不触发后续 Deploy
    paths-ignore:
      - "ccalm-miniprogram/**"
      - "README.md"
      - ".cursor/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".prettierignore"
      - ".prettierrc"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # prisma generate 需要读取 prisma.config.ts 中的 DATABASE_URL（仅生成客户端，不连库）
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install miniprogram dependencies
        run: npm ci --prefix ccalm-miniprogram

      - name: Generate Prisma Client
        run: pnpm -C ccalm-api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
