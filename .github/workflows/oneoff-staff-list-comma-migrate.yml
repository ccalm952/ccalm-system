# 一次性：生产库配台人员串顿号→全角逗号。跑完后删除本 workflow 与 scripts/_migrate-staff-list-comma.mjs
name: One-off staff list comma migrate

on:
  workflow_dispatch:

concurrency:
  group: oneoff-staff-list-comma-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ccalm_deploy
          chmod 600 ~/.ssh/ccalm_deploy
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Apply migrate on server
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/ccalm_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}" \
            'set -euo pipefail
             cd /opt/ccalm-system/ccalm-api
             set -a && source .env && set +a
             node scripts/_migrate-staff-list-comma.mjs
             node scripts/_migrate-staff-list-comma.mjs --apply
            '
